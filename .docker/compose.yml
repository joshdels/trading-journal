services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trading_journal
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_journal -d trading_journal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    environment: &journal-environment
      DJANGO_ENV: dev
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://trading_journal:local-only-password@db:5432/trading_journal
      POSTGRES_SSLMODE: disable
      MYFXBOOK_EMAIL: ${MYFXBOOK_EMAIL:-}
      MYFXBOOK_PASSWORD: ${MYFXBOOK_PASSWORD:-}
      MYFXBOOK_SYNC_INTERVAL_SECONDS: ${MYFXBOOK_SYNC_INTERVAL_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../media:/app/media

  worker:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    command: ["worker"]
    environment: *journal-environment
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
