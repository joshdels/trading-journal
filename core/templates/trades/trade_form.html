{% extends "base.html" %}
{% block title %}New trade · Trading Journal{% endblock %}
{% block content %}
<h1>New trade</h1>
<div class="panel" style="max-width:680px">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn mt" type="submit"><i class="ph ph-check"></i> Save</button>
    <a class="btn btn-ghost mt" href="{% url 'trade_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
