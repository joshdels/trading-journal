<form hx-post="{% url 'trade_review' trade.pk %}" hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  <div class="form-row">
    <div><label>Followed plan</label>{{ form.followed_plan }}</div>
    <div><label>Emotion</label>{{ form.emotion }}</div>
  </div>
  <label>What went well</label>{{ form.what_went_well }}
  <label>What went wrong</label>{{ form.what_went_wrong }}
  <label>Lesson</label>{{ form.lesson }}
  <label>Execution rating (1–5)</label>{{ form.rating }}
  <button class="btn mt" type="submit"><i class="ph ph-floppy-disk"></i> Save review</button>
</form>
